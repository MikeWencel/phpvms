# Docker Compose file for phpVMS v7.0.5 production setup with Nginx
services:
  app:
    container_name: phpvms-app
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    image: ghcr.io/phpvms/phpvms:7.0.5
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     WWWUSER: "${WWWUSER:-1000}"
    #     WWWGROUP: "${WWWGROUP:-1000}"
    hostname: app
    restart: unless-stopped
    environment:
      PHP_OPCACHE_ENABLE: 1
      AUTORUN_ENABLED: 1
    env_file: .env
    volumes:
      - ./app:/var/www/html/app:rw
      - ./public:/var/www/html/public:rw
      - ./resources/views:/var/www/html/resources/views:rw
      - ./resources/sass:/var/www/html/resources/sass:rw
      - ./resources/js:/var/www/html/resources/js:rw
      - ./modules:/var/www/html/modules:ro
      - phpvms_uploads:/var/www/html/public/uploads:rw
      - phpvms_storage:/var/www/html/storage:rw
    depends_on:
      - mariadb
      - redis
    networks:
      - phpvms

  task:
    container_name: phpvms-task
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    image: ghcr.io/phpvms/phpvms:7.0.5
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     WWWUSER: "${WWWUSER:-1000}"
    #     WWWGROUP: "${WWWGROUP:-1000}"
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      PHP_OPCACHE_ENABLE: 1
    healthcheck:
      test: [ "CMD", "healthcheck-schedule" ]
      start_period: 10s
    env_file: .env
    volumes:
      - ./app:/var/www/html/app:rw
      - ./public:/var/www/html/public:rw
      - ./resources/views:/var/www/html/resources/views:rw
      - ./resources/sass:/var/www/html/resources/sass:rw
      - ./resources/js:/var/www/html/resources/js:rw
      - ./modules:/var/www/html/modules:ro
      - phpvms_uploads:/var/www/html/public/uploads:rw
      - phpvms_storage:/var/www/html/storage:rw
    depends_on:
      - app
    networks:
      - phpvms

  queue:
    container_name: phpvms-queue
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    image: ghcr.io/phpvms/phpvms:7.0.5
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     WWWUSER: "${WWWUSER:-1000}"
    #     WWWGROUP: "${WWWGROUP:-1000}"
    restart: unless-stopped
    command: [ "php", "/var/www/html/artisan", "queue:work", "--tries=3" ]
    environment:
      PHP_OPCACHE_ENABLE: 1
    healthcheck:
      test: [ "CMD", "healthcheck-queue" ]
      start_period: 10s
    env_file: .env
    volumes:
      - ./app:/var/www/html/app:rw
      - ./public:/var/www/html/public:rw
      - ./resources/views:/var/www/html/resources/views:rw
      - ./resources/sass:/var/www/html/resources/sass:rw
      - ./resources/js:/var/www/html/resources/js:rw
      - ./modules:/var/www/html/modules:ro
      - phpvms_uploads:/var/www/html/public/uploads:rw
      - phpvms_storage:/var/www/html/storage:rw
    depends_on:
      - app
    networks:
      - phpvms

  nginx:
    container_name: phpvms-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./public:/var/www/html/public:ro
      # Serve uploaded files written by the app container
      - phpvms_uploads:/var/www/html/public/uploads:ro
      - ./resources/docker/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - phpvms

  mariadb:
    container_name: phpvms-mariadb
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'hello'
      MYSQL_DATABASE: 'hello'
      MYSQL_USER: 'hello'
      MYSQL_PASSWORD: 'hello'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    volumes:
      - ./docker-data/mariadb:/var/lib/mysql
    networks:
      - phpvms
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    container_name: phpvms-redis
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - ./docker-data/redis:/data
    networks:
      - phpvms
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s

volumes:
  phpvms_public:
  phpvms_uploads:
  phpvms_storage:

networks:
  phpvms:
    driver: bridge
